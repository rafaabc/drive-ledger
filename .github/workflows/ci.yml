name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly production-dependency audit so a quiet week of docs-only commits
    # (which skip test-unit..e2e below) doesn't go a month without a check
    # against newly-disclosed CVEs.
    - cron: '0 6 * * 1'

# Serialize all runs that touch the shared Atlas DB so concurrent e2e teardowns
# cannot delete another run's test users mid-suite.
concurrency:
  group: ci-shared-atlas
  cancel-in-progress: false

jobs:
  # Decides whether this push/PR touches anything besides docs. Deliberately a
  # job-level `if:` skip on test-unit..e2e below, NOT `paths-ignore` on the
  # triggers above: main's branch protection requires lint/audit/test-unit/
  # test-integration/test-api/e2e as status checks with enforce_admins on. If
  # the workflow never ran at all for a path, those contexts would never
  # report and the PR would be permanently unmergeable, even for admins. A
  # *skipped* job still reports success against its required context, so
  # gating jobs (as the fork-PR guards on test-api/e2e already do below) is
  # the only safe way to shrink CI for docs-only changes. Don't "simplify"
  # this back into paths-ignore.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Detect whether any non-docs file changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -e

          # Docs-only paths: Markdown anywhere, docs/, screenshots/, the issue
          # templates, and LICENSE. Everything else (including .github/workflows/**,
          # package*.json, sonar-project.properties) is treated as code.
          DOCS_PATTERN='^([^/]+\.md|docs/|screenshots/|\.github/ISSUE_TEMPLATE/|LICENSE)'

          code=true

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              if [ "$EVENT_NAME" = "pull_request" ]; then
                changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
              else
                changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
              fi

              echo "Changed files:"
              echo "$changed_files"

              if [ -n "$changed_files" ] && ! echo "$changed_files" | grep -qvE "$DOCS_PATTERN"; then
                code=false
              fi
            else
              echo "No usable base SHA (new branch or force-push) — running full CI."
            fi
          else
            echo "Event '$EVENT_NAME' isn't push/pull_request — running full CI."
          fi

          echo "code=$code" | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    # Scheduled run is audit-only (see the `schedule` trigger comment above).
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  test-unit:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run test:unit:coverage

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run test:integration:coverage

  test-api:
    needs: test-integration
    runs-on: ubuntu-latest
    # Fork PRs correctly don't receive repo secrets — skip rather than fail red,
    # since JWT_SECRET/MONGODB_URI will be empty and the server can't boot.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PORT: '3000'
      BASE_URL: 'http://localhost:3000'
      FRONTEND_URL: 'http://localhost:3000'
      JWT_EXPIRES_IN: '1h'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Build Next.js app
        run: npm run build
      - name: Start Next.js server
        run: npm start &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server ready"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 2s..."
            sleep 2
          done
          echo "Server did not start in time."
          exit 1
      - name: Run API tests
        run: npm run test:api:report
      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: reports/
          retention-days: 7

  e2e:
    needs: test-api
    runs-on: ubuntu-latest
    # Same fork-PR guard as test-api — no repo secrets available on a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BASE_URL: 'http://localhost:3000'
      FRONTEND_URL: 'http://localhost:3000'
      PORT: '3000'
      JWT_EXPIRES_IN: '1h'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: node_modules/.bin/playwright install chromium --with-deps
      - name: Build Next.js app
        run: npm run build
      - name: Start Next.js server
        run: npm start &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server ready"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 2s..."
            sleep 2
          done
          echo "Server did not start in time."
          exit 1
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
