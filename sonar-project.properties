# S1313 (hardcoded IP): test fixtures use RFC 5737 documentation-range IPs
# (192.0.2.0/24) as stand-ins for real client addresses — not real hosts.
# S2068 (hardcoded credentials): test-only fixture secrets (JWT_SECRET,
# RESEND_API_KEY, Stripe test keys, etc.) that never touch a real service —
# see the JWT/env fixture conventions documented in CLAUDE.md's Tests section.
# Both suppressions are scoped to test/** only; production code is not exempt.
#
# NOTE: this project's SonarCloud analysis runs in Automatic Analysis mode
# (no scanner step in ci.yml) — sonar-project.properties is not read at all
# in that mode (SonarCloud only reads .sonarcloud.properties for Automatic
# Analysis, and even that doesn't support sonar.issue.ignore.multicriteria).
# These two rules below are inert/unverified for that reason; left as-is
# rather than removed since they're harmless and may start working if this
# project ever switches to CI-based analysis.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=test/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=test/**/*
